<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE-H Team-10</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#1E56A0', 
                        secondary: '#F4F7FB',
                        accent: '#FF7F50',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            color: #1f2937;
            overflow-x: hidden;
        }
        
        .hero-pattern {
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .hero-overlay {
            background: linear-gradient(to bottom, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0) 100%);
        }
        
        .topic-card { transition: all 0.2s ease-in-out; }
        .topic-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }

        /* Icon Colors matching the image */
        .icon-python { color: #3776AB; }
        .icon-db { color: #336791; }
        .icon-ds { color: #8FBC8F; }
        .icon-web { color: #3b82f6; }
        .icon-idea { color: #F59E0B; }
        .icon-ml { color: #475569; }
        .icon-default { color: #1E56A0; }

        #notification-toast {
            bottom: -100px; 
            transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #notification-toast.show { bottom: 24px; }
    </style>
</head>
<body class="antialiased min-h-screen relative flex flex-col">

    <!-- Welcome Hero Section -->
    <header class="relative hero-pattern h-[45vh] md:h-[55vh] flex flex-col items-center justify-center text-center p-6">
        <div class="absolute inset-0 hero-overlay z-0"></div>
        
        <!-- Secret Lock (Top Right) -->
        <div id="secretLock" class="absolute top-6 right-6 cursor-pointer p-2 z-50 transition-opacity opacity-70 hover:opacity-100" title="Secret Area">
            <i class="fas fa-lock text-gray-800 text-xl"></i>
        </div>

        <div class="z-10 flex flex-col items-center mt-4">
            <div class="mb-3 text-primary">
                <i class="fas fa-graduation-cap text-5xl"></i>
            </div>
            <p class="text-xl md:text-2xl font-semibold tracking-wide mb-1 text-primary">Welcome to webpage of</p>
            <div class="relative inline-block">
                <h1 class="text-6xl md:text-8xl font-black mb-1 tracking-tight text-primary drop-shadow-md">
                    CSE - H
                </h1>
            </div>
            <div class="flex items-center justify-center gap-4 mb-4">
                <div class="h-[2px] w-10 bg-primary"></div>
                <h2 class="text-2xl md:text-3xl font-bold text-primary tracking-wide">Team -10</h2>
                <div class="h-[2px] w-10 bg-primary"></div>
            </div>
            <p class="text-gray-800 font-semibold tracking-wide text-sm md:text-base">
                Learn &nbsp;&bull;&nbsp; Share &nbsp;&bull;&nbsp; Grow Together
            </p>
            <div class="mt-2 text-gray-800">
                <i class="fas fa-users text-lg"></i>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-[1200px] relative z-10 -mt-6">
        
        <!-- Toolbar -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 bg-white p-3 rounded-xl shadow-sm border border-gray-200">
            <!-- Search -->
            <div class="relative w-full md:w-1/2 lg:w-1/3">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fas fa-search text-gray-400"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Search by title..." class="w-full pl-11 pr-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium">
            </div>
            
            <div class="flex w-full md:w-auto items-center gap-3">
                <!-- Sort -->
                <div class="w-full md:w-auto flex items-center bg-white rounded-lg border border-gray-200 px-3 relative">
                    <i class="far fa-calendar-alt text-gray-500 absolute left-3"></i>
                    <select id="sortSelect" class="w-full md:w-auto pl-8 pr-8 py-2.5 rounded-lg focus:outline-none bg-transparent text-sm font-medium text-gray-700 appearance-none cursor-pointer">
                        <option value="newest">Sort by: Date Uploaded</option>
                        <option value="oldest">Sort by: Oldest First</option>
                    </select>
                    <i class="fas fa-chevron-down text-gray-500 absolute right-3 pointer-events-none text-xs"></i>
                </div>

                <!-- Admin Action Button -->
                <button id="addTopicBtn" class="hidden w-full md:w-auto bg-[#3b82f6] text-white px-5 py-2.5 rounded-lg hover:bg-blue-600 transition font-medium shadow-sm whitespace-nowrap text-sm">
                    <i class="fas fa-plus mr-1"></i> Add Topic
                </button>
            </div>
        </div>

        <!-- Topics Feed -->
        <div id="topicsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically injected -->
        </div>
        
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-gray-500 bg-white rounded-2xl shadow-sm border border-gray-100">
            <i class="fas fa-folder-open text-6xl mb-4 text-gray-300"></i>
            <p class="text-xl font-medium">No topics found.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#2D3748] text-gray-300 py-4 text-center text-sm flex items-center justify-between px-8 border-t border-gray-600 mt-8">
        <div></div> 
        <div>CSE - H <span class="mx-2">|</span> Team -10 <i class="fas fa-heart text-gray-400 text-xs ml-1"></i></div>
        <div class="flex items-center gap-2 opacity-60 italic">Better Together</div>
    </footer>

    <!-- Modals Overlay -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        
        <!-- Login Modal -->
        <div id="loginModal" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 hidden relative">
            <button class="close-modal absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            <div class="flex items-center gap-2 mb-6">
                <i class="fas fa-lock text-gray-800 text-lg"></i>
                <h2 class="text-lg font-bold text-gray-800">Admin Login</h2>
            </div>
            <div class="space-y-4">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center"><i class="far fa-user text-gray-400 text-sm"></i></div>
                    <input type="email" id="loginEmail" class="w-full pl-9 pr-4 py-2 border rounded-lg outline-none text-sm focus:border-blue-500" placeholder="admin123@maom.com">
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center"><i class="fas fa-lock text-gray-400 text-xs"></i></div>
                    <input type="password" id="loginPassword" class="w-full pl-9 pr-4 py-2 border rounded-lg outline-none text-sm focus:border-blue-500" placeholder="Password">
                </div>
                <div id="loginError" class="text-red-500 text-xs hidden font-medium text-center bg-red-50 p-2 rounded">Invalid credentials.</div>
                <button id="loginSubmitBtn" class="w-full bg-[#3b82f6] text-white font-medium py-2 rounded-lg hover:bg-blue-600 transition text-sm shadow-sm">Login</button>
            </div>
        </div>

        <!-- Topic Form Modal -->
        <div id="topicModal" class="bg-white rounded-2xl shadow-2xl w-full max-w-xl p-6 hidden max-h-[90vh] overflow-y-auto relative">
            <button class="close-modal absolute top-5 right-5 text-gray-400 hover:text-gray-600"><i class="fas fa-times text-lg"></i></button>
            <h2 id="topicModalTitle" class="text-xl font-bold text-gray-800 mb-5 border-b pb-3">Add New Topic</h2>
            <input type="hidden" id="editTopicId">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Topic Title *</label>
                    <input type="text" id="topicTitle" class="w-full px-3 py-2 border rounded-lg outline-none text-sm focus:border-blue-500 bg-gray-50" placeholder="e.g. Python Basics">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Description *</label>
                    <textarea id="topicDesc" rows="3" class="w-full px-3 py-2 border rounded-lg outline-none text-sm focus:border-blue-500 bg-gray-50" placeholder="Briefly describe the topic..."></textarea>
                </div>
                <div class="bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                    <label class="block text-sm font-semibold text-gray-800 mb-2">Resource Attachment</label>
                    <div class="space-y-3">
                        <div>
                            <input type="file" id="topicFile" accept="image/*,video/*,application/pdf" class="w-full text-xs text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-semibold file:bg-white file:text-blue-600 file:border file:border-blue-200 cursor-pointer">
                        </div>
                        <div class="text-xs text-center text-gray-400 font-bold">OR</div>
                        <div>
                            <input type="url" id="topicUrl" class="w-full px-3 py-2 border rounded-lg outline-none text-sm bg-white focus:border-blue-500" placeholder="Paste an external URL link here...">
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-4 border-t">
                <button class="close-modal px-5 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm border">Cancel</button>
                <button id="saveTopicBtn" class="px-5 py-2 rounded-lg bg-[#3b82f6] text-white hover:bg-blue-600 font-medium text-sm shadow-sm">Save Topic</button>
            </div>
        </div>

        <!-- Confirm Delete Modal -->
        <div id="confirmModal" class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 hidden text-center">
            <div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-3"><i class="far fa-trash-alt text-xl text-red-500"></i></div>
            <h3 class="text-lg font-bold text-gray-800 mb-1">Delete Topic?</h3>
            <p class="text-gray-500 text-sm mb-5">This action cannot be undone.</p>
            <div class="flex justify-center gap-3">
                <button class="close-modal px-4 py-2 rounded-lg text-gray-600 border w-full text-sm font-medium">Cancel</button>
                <button id="confirmDeleteBtn" class="px-4 py-2 rounded-lg bg-red-500 text-white w-full text-sm font-medium">Delete</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification-toast" class="fixed right-6 bg-[#1E293B] text-white p-4 rounded-xl shadow-2xl z-50 flex items-start gap-3 max-w-sm border border-gray-700">
        <div class="text-[#F59E0B] mt-0.5"><i class="fas fa-exclamation-triangle"></i></div>
        <div>
            <h4 class="font-semibold text-sm mb-1 text-white">Admin Page</h4>
            <p class="text-xs text-gray-300">This is the admin section.<br><i class="fas fa-lock text-[#F59E0B] mr-1 text-[10px]"></i> Please login to continue.</p>
        </div>
        <button onclick="document.getElementById('notification-toast').classList.remove('show')" class="text-gray-400 hover:text-white absolute top-3 right-3 text-xs"><i class="fas fa-times"></i></button>
    </div>

    <script>
        // --- State Management ---
        let isAdmin = false;
        let allTopics = [];
        let base64ResourceData = null;
        let itemToDelete = null;

        // Default Data exactly matching your requested UI Image
        const defaultMockData = [
            { id: '1', title: 'Python Basics', description: 'Basic python concepts, syntax and\nexamples for beginners.', createdAt: Date.now(), resources: 'mock_python' },
            { id: '2', title: 'Data Structures', description: 'Important concepts of arrays, linked lists,\nstack and queue.', createdAt: Date.now() - 1000, resources: 'mock_ds' },
            { id: '3', title: 'Web Development', description: 'HTML, CSS and JavaScript basics with\nexamples.', createdAt: Date.now() - 2000, resources: 'mock_web' },
            { id: '4', title: 'Database Systems', description: 'Introduction to DBMS, SQL queries and\nnormalization.', createdAt: Date.now() - 3000, resources: 'mock_db' },
            { id: '5', title: 'Project Ideas', description: 'Some interesting project ideas for CSE\nstudents.', createdAt: Date.now() - 4000, resources: 'mock_idea' },
            { id: '6', title: 'Machine Learning', description: 'Overview of ML, types and real world\napplications.', createdAt: Date.now() - 5000, resources: 'mock_none' }
        ];

        // --- Initialize App from LocalStorage ---
        function initApp() {
            const savedData = localStorage.getItem('team10_topics');
            if (savedData) {
                allTopics = JSON.parse(savedData);
            } else {
                allTopics = [...defaultMockData];
                saveToLocalStorage();
            }
            renderTopics();
        }

        function saveToLocalStorage() {
            localStorage.setItem('team10_topics', JSON.stringify(allTopics));
        }

        // --- Render UI ---
        const topicsContainer = document.getElementById('topicsContainer');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        function renderTopics() {
            const query = searchInput.value.toLowerCase().trim();
            const sort = sortSelect.value;
            
            let filtered = allTopics.filter(t => t.title.toLowerCase().includes(query));
            
            filtered.sort((a, b) => sort === 'newest' ? b.createdAt - a.createdAt : a.createdAt - b.createdAt);

            topicsContainer.innerHTML = '';
            if (filtered.length === 0) {
                topicsContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.style.display = 'flex';
            } else {
                topicsContainer.classList.remove('hidden');
                emptyState.style.display = 'none';
                filtered.forEach(topic => topicsContainer.appendChild(createTopicCard(topic)));
            }
        }

        function getIconProps(title) {
            const t = title.toLowerCase();
            if (t.includes('python')) return { c: 'fab fa-python icon-python' };
            if (t.includes('data structure')) return { c: 'fas fa-project-diagram icon-ds' };
            if (t.includes('web')) return { c: 'fas fa-globe icon-web' };
            if (t.includes('database')) return { c: 'fas fa-database icon-db' };
            if (t.includes('idea')) return { c: 'far fa-lightbulb icon-idea' };
            if (t.includes('machine learning')) return { c: 'fas fa-brain icon-ml' };
            return { c: 'fas fa-book icon-default' };
        }

        function getResourceHTML(res) {
            if (!res || res === 'mock_none') return `<div class="w-full text-center py-2 px-3 border border-dashed border-gray-300 rounded text-xs text-gray-500 bg-gray-50"><i class="far fa-folder-open"></i> No resource available... 😞</div>`;
            if (res === 'mock_python') return `<span class="flex items-center gap-1"><i class="far fa-file-alt text-gray-500"></i> Notes.pdf</span> <span class="flex items-center gap-1"><i class="far fa-image text-gray-500"></i> code.png</span> <span class="flex items-center gap-1 text-[#3b82f6]"><i class="fas fa-play"></i> intro.mp4</span>`;
            if (res === 'mock_ds') return `<span class="flex items-center gap-1"><i class="far fa-file-alt text-gray-500"></i> DS_Notes.pdf</span> <span class="flex items-center gap-1 text-[#3b82f6]"><i class="fas fa-play"></i> lecture.mp4</span>`;
            if (res === 'mock_web') return `<span class="flex items-center gap-1"><i class="far fa-image text-gray-500"></i> webdev.png</span> <span class="flex items-center gap-1"><i class="far fa-file-alt text-gray-500"></i> guide.pdf</span>`;
            if (res === 'mock_db') return `<span class="flex items-center gap-1 text-[#3b82f6]"><i class="fas fa-play"></i> dbms.mp4</span> <span class="flex items-center gap-1"><i class="far fa-file-alt text-gray-500"></i> notes.pdf</span>`;
            if (res === 'mock_idea') return `<span class="flex items-center gap-1"><i class="far fa-image text-gray-500"></i> ideas.png</span> <span class="flex items-center gap-1"><i class="far fa-file-alt text-gray-500"></i> list.pdf</span>`;
            
            if (res.startsWith('data:')) return `<span class="flex items-center gap-1"><i class="fas fa-paperclip text-gray-500"></i> Custom File Attached</span>`;
            if (res.startsWith('http')) return `<a href="${res}" target="_blank" class="flex items-center gap-1 text-blue-500 hover:underline"><i class="fas fa-link"></i> External Link</a>`;
            return `<span class="flex items-center gap-1"><i class="fas fa-file"></i> Attached</span>`;
        }

        function createTopicCard(topic) {
            const div = document.createElement('div');
            div.className = 'topic-card bg-white rounded-xl p-5 border border-gray-200 flex flex-col h-full relative group';
            
            const d = new Date(topic.createdAt);
            const dateStr = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            const icon = getIconProps(topic.title);

            let adminTools = '';
            if (isAdmin) {
                adminTools = `
                    <div class="absolute bottom-4 right-4 flex gap-3">
                        <button onclick="editTopic('${topic.id}')" class="text-blue-600 hover:text-blue-800 p-1"><i class="fas fa-pen text-sm"></i></button>
                        <button onclick="deletePrompt('${topic.id}')" class="text-red-500 hover:text-red-700 p-1"><i class="far fa-trash-alt text-sm"></i></button>
                    </div>`;
            }

            div.innerHTML = `
                <div class="flex gap-4 mb-3">
                    <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center mt-1">
                        <i class="${icon.c} text-4xl drop-shadow-sm"></i>
                    </div>
                    <div>
                        <h3 class="text-[17px] font-bold text-[#1E293B] mb-0.5">${topic.title}</h3>
                        <div class="text-[11px] font-medium text-gray-500 flex items-center gap-1">
                            <i class="far fa-calendar-alt"></i> ${dateStr}
                        </div>
                    </div>
                </div>
                <p class="text-gray-600 text-[13px] mb-5 whitespace-pre-line leading-relaxed flex-grow">${topic.description}</p>
                <div class="mt-auto">
                    <h4 class="text-[11px] font-semibold text-gray-500 mb-2">Resources:</h4>
                    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-[12px] text-gray-600 font-medium pb-2">
                        ${getResourceHTML(topic.resources)}
                    </div>
                </div>
                ${adminTools}
            `;
            return div;
        }

        searchInput.addEventListener('input', renderTopics);
        sortSelect.addEventListener('change', renderTopics);

        // --- Admin Lock Logic ---
        let lockClicks = 0, lockTimeout;
        const toast = document.getElementById('notification-toast');
        const loginModal = document.getElementById('loginModal');
        const addTopicBtn = document.getElementById('addTopicBtn');
        const modalOverlay = document.getElementById('modalOverlay');

        document.getElementById('secretLock').addEventListener('click', () => {
            lockClicks++;
            clearTimeout(lockTimeout);
            lockTimeout = setTimeout(() => lockClicks = 0, 2000);

            if (lockClicks === 1 && !isAdmin) {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 4000);
            } else if (lockClicks === 3) {
                lockClicks = 0;
                toast.classList.remove('show');
                if (!isAdmin) showModal('loginModal');
                else {
                    isAdmin = false;
                    addTopicBtn.classList.add('hidden');
                    renderTopics();
                    alert("Logged out of Admin mode");
                }
            }
        });

        // --- Modals Logic ---
        function showModal(id) {
            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('flex');
            document.querySelectorAll('#modalOverlay > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function hideModals() {
            modalOverlay.classList.add('hidden');
            modalOverlay.classList.remove('flex');
        }

        document.querySelectorAll('.close-modal').forEach(btn => btn.addEventListener('click', hideModals));

        // --- Login ---
        document.getElementById('loginSubmitBtn').addEventListener('click', () => {
            if (document.getElementById('loginEmail').value === 'admin123@maom.com' && 
                document.getElementById('loginPassword').value === 'relax') {
                isAdmin = true;
                hideModals();
                addTopicBtn.classList.remove('hidden');
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginError').classList.add('hidden');
                renderTopics();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        // --- Add/Edit Topic ---
        const topicTitle = document.getElementById('topicTitle');
        const topicDesc = document.getElementById('topicDesc');
        const topicFile = document.getElementById('topicFile');
        const topicUrl = document.getElementById('topicUrl');
        const editTopicId = document.getElementById('editTopicId');

        addTopicBtn.addEventListener('click', () => {
            document.getElementById('topicModalTitle').innerText = "Add New Topic";
            editTopicId.value = '';
            topicTitle.value = ''; topicDesc.value = '';
            topicFile.value = ''; topicUrl.value = ''; base64ResourceData = null;
            showModal('topicModal');
        });

        topicFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                base64ResourceData = event.target.result;
                topicUrl.value = ''; // clear url if file uploaded
            };
            reader.readAsDataURL(file);
        });

        topicUrl.addEventListener('input', () => {
            if (topicUrl.value.trim() !== '') {
                topicFile.value = '';
                base64ResourceData = null;
            }
        });

        document.getElementById('saveTopicBtn').addEventListener('click', () => {
            if (!topicTitle.value.trim() || !topicDesc.value.trim()) return alert("Title and Description required!");
            
            let finalRes = base64ResourceData || topicUrl.value.trim() || 'mock_none';
            
            if (editTopicId.value) {
                const index = allTopics.findIndex(t => t.id === editTopicId.value);
                allTopics[index].title = topicTitle.value.trim();
                allTopics[index].description = topicDesc.value.trim();
                if(topicFile.value || topicUrl.value) allTopics[index].resources = finalRes;
            } else {
                allTopics.push({
                    id: Date.now().toString(),
                    title: topicTitle.value.trim(),
                    description: topicDesc.value.trim(),
                    createdAt: Date.now(),
                    resources: finalRes
                });
            }
            saveToLocalStorage();
            hideModals();
            renderTopics();
        });

        window.editTopic = function(id) {
            const topic = allTopics.find(t => t.id === id);
            document.getElementById('topicModalTitle').innerText = "Edit Topic";
            editTopicId.value = topic.id;
            topicTitle.value = topic.title;
            topicDesc.value = topic.description;
            topicFile.value = ''; topicUrl.value = ''; base64ResourceData = null;
            showModal('topicModal');
        };

        // --- Delete ---
        window.deletePrompt = function(id) {
            itemToDelete = id;
            showModal('confirmModal');
        };

        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            allTopics = allTopics.filter(t => t.id !== itemToDelete);
            saveToLocalStorage();
            hideModals();
            renderTopics();
        });

        // Run
        initApp();
    </script>
</body>
</html>
